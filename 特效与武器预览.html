  bpCv.width = bpW * dpr; bpCv.height = bpH * dpr;
  const r2 = cbCv.getBoundingClientRect();
  cbW = r2.width || 700; cbH = r2.height || 500;
  cbCv.width = cbW * dpr; cbCv.height = cbH * dpr;
}

/* ══════════════ 复用函数 1：绘制Ⅰ/Ⅱ/Ⅲ阶单流派小球标识 ══════════════ */
function drawStyledOrb(ctx, x, y, r, archId, stageIdx, t) {
  ctx.save(); ctx.translate(x, y);
  if (archId === 'xianxia' && stageIdx >= 1) {
    ctx.save(); ctx.rotate(t * 1.4); ctx.strokeStyle = '#00A86B'; ctx.lineWidth = 2;
    const cnt = stageIdx === 2 ? 8 : 4;
    for (let i = 0; i < cnt; i++) { ctx.rotate(TAU / cnt); ctx.beginPath(); ctx.moveTo(r + 3, 0); ctx.lineTo(r + (stageIdx === 2 ? 10 : 7), 0); ctx.stroke(); }
    ctx.restore();
  } else if (archId === 'norse' && stageIdx >= 1) {
    ctx.save(); ctx.rotate(t * 2);
    const cnt = stageIdx === 2 ? 6 : 3;
    for (let i = 0; i < cnt; i++) {
      ctx.rotate(TAU / cnt); ctx.beginPath(); ctx.moveTo(r + 9, 0); ctx.lineTo(r + 3, -3.5); ctx.lineTo(r + 3, 3.5); ctx.closePath();
      ctx.fillStyle = stageIdx === 2 ? '#FFB800' : '#4F3CC9'; ctx.fill();
    }
    ctx.restore();
  } else if (archId === 'xuanhuan' && stageIdx >= 1) {
    ctx.save(); ctx.rotate(t * 1.5); const sz = r * 1.25;
    ctx.strokeStyle = stageIdx === 2 ? '#FFB800' : '#E63312'; ctx.lineWidth = 1.8;
    ctx.strokeRect(-sz, -sz, sz * 2, sz * 2);
    if (stageIdx === 2) { ctx.rotate(Math.PI / 4); ctx.strokeStyle = '#111315'; ctx.strokeRect(-sz, -sz, sz * 2, sz * 2); }
    ctx.restore();
  } else if (archId === 'arcane' && stageIdx >= 1) {
    ctx.save(); ctx.rotate(t * 1.2); ctx.strokeStyle = '#D97706'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, TAU); ctx.stroke();
    const cnt = stageIdx === 2 ? 4 : 2;
    for (let i = 0; i < cnt; i++) { ctx.rotate(TAU / cnt); ctx.fillStyle = '#FFB800'; ctx.fillRect(r + 4, -2.5, 5, 5); }
    ctx.restore();
  } else if (archId === 'billiard' && stageIdx >= 1) {
    ctx.save(); ctx.rotate(t * 0.6); ctx.strokeStyle = '#111315'; ctx.lineWidth = 1.8;
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.arc(0, 0, r + 5, -0.35, 0.35); ctx.stroke(); }
    ctx.restore();
  } else if (archId === 'exact_zero' && stageIdx >= 1) {
    ctx.save(); ctx.rotate(-t * 0.9); ctx.strokeStyle = '#0055FF'; ctx.lineWidth = 1.6;
    const m = r + 6;
    ctx.beginPath(); ctx.moveTo(-m, 0); ctx.lineTo(-r - 1, 0); ctx.moveTo(m, 0); ctx.lineTo(r + 1, 0);
    ctx.moveTo(0, -m); ctx.lineTo(0, -r - 1); ctx.moveTo(0, m); ctx.lineTo(0, r + 1); ctx.stroke();
    ctx.restore();
  }

  const baseCol = archId === 'billiard' ? (stageIdx === 2 ? '#111315' : '#FFFFFF')
    : archId === 'xianxia' ? '#00A86B' : archId === 'norse' ? '#4F3CC9'
    : archId === 'xuanhuan' ? '#E63312' : archId === 'arcane' ? '#FFB800' : '#0055FF';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = baseCol; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#111315'; ctx.stroke();

  const s = r * 0.58;
  ctx.strokeStyle = '#FFFFFF'; ctx.fillStyle = '#FFFFFF'; ctx.lineWidth = 1.8;
  if (archId === 'xianxia') {
    if (stageIdx === 0) {
      ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.45, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.45, 0); ctx.closePath(); ctx.stroke();
    } else if (stageIdx === 1) {
      ctx.rotate(t * 1.5);
      ctx.beginPath(); ctx.arc(0, 0, s, -Math.PI / 2, Math.PI / 2); ctx.fillStyle = '#111315'; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, s, Math.PI / 2, -Math.PI / 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    } else {
      ctx.rotate(t * 1.2);
      for (let k = 0; k < 2; k++) { ctx.rotate(Math.PI / 4); ctx.strokeRect(-s * 0.72, -s * 0.72, s * 1.44, s * 1.44); }
    }
  } else if (archId === 'norse') {
    ctx.strokeStyle = stageIdx === 2 ? '#FFB800' : '#FFFFFF';
    if (stageIdx === 0) {
      ctx.beginPath(); ctx.moveTo(s * 0.35, -s * 0.8); ctx.lineTo(-s * 0.4, 0); ctx.lineTo(s * 0.4, 0); ctx.lineTo(-s * 0.35, s * 0.8); ctx.stroke();
    } else if (stageIdx === 1) {
      ctx.beginPath(); ctx.rect(-s * 0.65, -s * 0.65, s * 1.3, s * 0.55); ctx.moveTo(0, -s * 0.1); ctx.lineTo(0, s * 0.85); ctx.stroke();
    } else {
      ctx.rotate(t * 0.9);
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 4); ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(0, s); ctx.stroke(); }
    }
  } else if (archId === 'xuanhuan') {
    if (stageIdx === 0) {
      ctx.beginPath(); ctx.arc(0, 0, s * 0.45, 0, TAU); ctx.fill();
    } else if (stageIdx === 1) {
      ctx.rotate(t * 1.6); ctx.fillStyle = '#FFB800'; ctx.fillRect(-s * 0.6, -s * 0.6, s * 1.2, s * 1.2);
      ctx.beginPath(); ctx.arc(0, 0, s * 0.3, 0, TAU); ctx.fillStyle = '#111315'; ctx.fill();
    } else {
      ctx.rotate(-t * 1.4); ctx.strokeStyle = '#FFB800';
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 4); ctx.strokeRect(-s * 0.65, -s * 0.65, s * 1.3, s * 1.3); }
    }
  } else if (archId === 'arcane') {
    ctx.strokeStyle = '#111315';
    if (stageIdx === 0) {
      ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.85, s * 0.6); ctx.lineTo(-s * 0.85, s * 0.6); ctx.closePath(); ctx.stroke();
    } else if (stageIdx === 1) {
      ctx.rotate(t);
      for (let k = 0; k < 2; k++) { ctx.rotate(Math.PI); ctx.strokeStyle = k ? '#FFFFFF' : '#111315'; ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.85, s * 0.5); ctx.lineTo(-s * 0.85, s * 0.5); ctx.closePath(); ctx.stroke(); }
    } else {
      ctx.rotate(t * 1.5); ctx.beginPath(); ctx.arc(0, 0, s * 0.88, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, s * 0.88, s * 0.36, 0, 0, TAU); ctx.stroke();
    }
  } else if (archId === 'billiard') {
    if (stageIdx === 0) {
      ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, TAU); ctx.fillStyle = '#E63312'; ctx.fill();
    } else if (stageIdx === 1) {
      ctx.fillStyle = '#111315'; ctx.fillRect(-r * 0.9, -r * 0.4, r * 1.8, r * 0.8);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.36, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    } else {
      ctx.rotate(t * 2.5); ctx.strokeStyle = '#FFB800';
      for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * 0.85, 0); ctx.stroke(); }
    }
  } else {
    if (stageIdx === 0) {
      ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.6); ctx.lineTo(-s * 0.3, s * 0.6); ctx.moveTo(s * 0.3, -s * 0.6); ctx.lineTo(s * 0.3, s * 0.6); ctx.stroke();
    } else if (stageIdx === 1) {
      ctx.beginPath(); ctx.arc(0, 0, s * 0.55, 0, TAU); ctx.stroke();
    } else {
      ctx.rotate(t); ctx.strokeStyle = '#FFB800'; ctx.strokeRect(-s * 0.7, -s * 0.7, s * 1.4, s * 1.4);
    }
  }
  ctx.restore();
}

/* ══════════════ 复用函数 2：绘制Ⅳ阶·双极叠加态小球标识 ══════════════ */
function drawSuperpositionOrb(ctx, x, y, r, combo, t) {
  ctx.save(); ctx.translate(x, y);
  const colA = combo.a.col, colB = combo.b.col;
  ctx.save(); ctx.rotate(t * 1.4);
  const or = r * 1.3;
  ctx.strokeStyle = colA; ctx.lineWidth = 1.8; ctx.strokeRect(-or * 0.7, -or * 0.7, or * 1.4, or * 1.4);
  ctx.rotate(Math.PI / 4 - t * 2.8); ctx.strokeStyle = colB; ctx.strokeRect(-or * 0.7, -or * 0.7, or * 1.4, or * 1.4);
  ctx.restore();

  ctx.save(); ctx.rotate(t * 0.8);
  ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2); ctx.fillStyle = colA; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI / 2, -Math.PI / 2); ctx.fillStyle = colB; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.strokeStyle = '#111315'; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.restore();

  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.lineWidth = 2.2; ctx.strokeStyle = '#111315'; ctx.stroke();
  const s = r * 0.6;
  ctx.rotate(-t * 1.5); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.8;
  ctx.strokeRect(-s * 0.68, -s * 0.68, s * 1.36, s * 1.36);
  ctx.rotate(Math.PI / 4); ctx.strokeStyle = '#FFB800';
  ctx.strokeRect(-s * 0.68, -s * 0.68, s * 1.36, s * 1.36);
  ctx.restore();
}

function renderBlueprint() {
  bpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bpCtx.clearRect(0, 0, bpW, bpH);
  const cy = bpH * 0.46;
  const xs = [bpW * 0.18, bpW * 0.50, bpW * 0.82];

  if (tabMode === 'progression') {
    const arch = ARCHETYPES[selIdx];
    for (let i = 0; i < 2; i++) {
      bpCtx.beginPath(); bpCtx.moveTo(xs[i] + 28, cy); bpCtx.lineTo(xs[i + 1] - 28, cy);
      bpCtx.strokeStyle = i < curStage ? arch.color : 'rgba(17,19,21,0.2)'; bpCtx.lineWidth = 2; bpCtx.stroke();
    }
    const lbs = ['Ⅰ阶·初态', 'Ⅱ阶·中间态★', 'Ⅲ阶·觉醒'];
    for (let s = 0; s < 3; s++) {
      drawStyledOrb(bpCtx, xs[s], cy, s === curStage ? 24 : 19, arch.id, s, time);
      bpCtx.font = (s === curStage ? '800 ' : '600 ') + '11px Inter, sans-serif';
      bpCtx.textAlign = 'center'; bpCtx.fillStyle = '#111315';
      bpCtx.fillText(lbs[s], xs[s], bpH - 12);
    }
  } else {
    const c = COMBOS[selIdx];
    drawStyledOrb(bpCtx, xs[0], cy, 20, c.a.type, 2, time);
    drawStyledOrb(bpCtx, xs[1], cy, 20, c.b.type, 2, time);
    bpCtx.font = '900 18px Inter, sans-serif'; bpCtx.textAlign = 'center'; bpCtx.fillStyle = '#111315';
    bpCtx.fillText('+', (xs[0] + xs[1]) / 2, cy + 5);
    bpCtx.fillText('⇒', (xs[1] + xs[2]) / 2, cy + 5);
    drawSuperpositionOrb(bpCtx, xs[2], cy, 25, c, time);
    bpCtx.font = '700 11px Inter, sans-serif';
    bpCtx.fillText('Ⅲ·' + c.a.name, xs[0], bpH - 12);
    bpCtx.fillText('Ⅲ·' + c.b.name, xs[1], bpH - 12);
    bpCtx.fillStyle = '#E63312'; bpCtx.fillText('Ⅳ阶·叠加态', xs[2], bpH - 12);
  }
}

function spawnEnemies(n) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + rand(-0.1, 0.1);
    const d = rand(110, 220);
    enemies.push({
      id: Math.random(),
      x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d,
      vx: 0, vy: 0, kx: 0, ky: 0, r: rand(14, 19), hp: 20, speed: rand(42, 65),
      color: i % 3 === 0 ? '#4F3CC9' : '#E63312', flash: 0, squash: 0, squashAng: 0, collideCd: 0, dead: false
    });
  }
}

function findNearest(x, y, maxR, skip) {
  let best = null, bd = maxR * maxR;
  for (const e of enemies) {
    if (e.dead || (skip && skip.has(e.id))) continue;
    const d = distSq(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function triggerUlt() {
  fx.push({ kind: 'lotus', x: player.x, y: player.y, r: 15, maxR: 185, life: 0.55, max: 0.55, rot: 0 });
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU;
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 540, vy: Math.sin(a) * 540, r: 9, dmg: 10, pierce: 2, life: 1.2, hit: new Set() });
  }
}

function update(dt) {
  time += dt;
  player.x = Math.cos(time * 0.85) * 55;
  player.y = Math.sin(time * 1.7) * 38;

  player.ultT -= dt;
  if (player.ultT <= 0) { player.ultT = 2.4; triggerUlt(); }

  player.fireT -= dt;
  if (player.fireT <= 0) {
    player.fireT = 0.36;
    const t = findNearest(player.x, player.y, 420);
    const a = t ? Math.atan2(t.y - player.y, t.x - player.x) : time;
    const cnt = (tabMode === 'superposition' || curStage >= 1) ? 2 : 1;
    for (let i = 0; i < cnt; i++) {
      const off = (i - (cnt - 1) / 2) * 0.16;
      bullets.push({ x: player.x, y: player.y, vx: Math.cos(a + off) * 580, vy: Math.sin(a + off) * 580, r: 8, dmg: 8, pierce: curStage, life: 1.2, hit: new Set() });
    }
  }

  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    for (const e of enemies) {
      if (e.dead || b.hit.has(e.id)) continue;
      if (distSq(b.x, b.y, e.x, e.y) <= (b.r + e.r) ** 2) {
        b.hit.add(e.id); e.hp -= b.dmg; e.flash = 0.08; e.squash = 0.25;
        e.squashAng = Math.atan2(b.vy, b.vx);
        e.kx += Math.cos(e.squashAng) * 320; e.ky += Math.sin(e.squashAng) * 320;
        fx.push({ kind: 'lotus', x: e.x, y: e.y, r: 6, maxR: 65, life: 0.38, max: 0.38, rot: rand(0, TAU) });
        if (e.hp <= 0) e.dead = true;
        if (b.pierce > 0) { b.pierce--; continue; }
        b.dead = true; break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  for (const e of enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.squash > 0) e.squash = Math.max(0, e.squash - dt * 2.2);
    if (e.collideCd > 0) e.collideCd -= dt;
    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.vx = (dx / d) * e.speed; e.vy = (dy / d) * e.speed;
    e.kx *= Math.max(0, 1 - 5 * dt); e.ky *= Math.max(0, 1 - 5 * dt);
    e.x += (e.vx + e.kx) * dt; e.y += (e.vy + e.ky) * dt;
  }

  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 < 0.01) continue;
      const d = Math.sqrt(d2), ux = dx / d, uy = dy / d, push = (rr - d) * 0.5;
      a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push;
      if (Math.hypot(a.kx - b.kx, a.ky - b.ky) > 120 && a.collideCd <= 0 && b.collideCd <= 0) {
        a.collideCd = 0.15; b.collideCd = 0.15;
        b.kx = ux * 320; b.ky = uy * 320;
        a.hp -= 6; b.hp -= 6;
        if (a.hp <= 0) a.dead = true;
        if (b.hp <= 0) b.dead = true;
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
  if (enemies.length < 12) spawnEnemies(14);

  for (const f of fx) { f.life -= dt; f.r = f.maxR * (1 - f.life / f.max); }
  fx = fx.filter(f => f.life > 0);
}

function renderCombat() {
  cbCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cbCtx.fillStyle = '#ECEAE2'; cbCtx.fillRect(0, 0, cbW, cbH);
  cbCtx.beginPath();
  for (let x = 0; x < cbW; x += 52) { cbCtx.moveTo(x, 0); cbCtx.lineTo(x, cbH); }
  for (let y = 0; y < cbH; y += 52) { cbCtx.moveTo(0, y); cbCtx.lineTo(cbW, y); }
  cbCtx.strokeStyle = 'rgba(17,19,21,0.05)'; cbCtx.lineWidth = 1; cbCtx.stroke();

  cbCtx.save(); cbCtx.translate(cbW / 2, cbH / 2);

  for (const f of fx) {
    const a = clamp(f.life / f.max, 0, 1);
    cbCtx.save(); cbCtx.translate(f.x, f.y); cbCtx.rotate(f.rot + (1 - a) * 1.5);
    cbCtx.strokeStyle = rgba('#E63312', a * 0.85); cbCtx.lineWidth = 2.2;
    cbCtx.strokeRect(-f.r * 0.7, -f.r * 0.7, f.r * 1.4, f.r * 1.4);
    cbCtx.rotate(Math.PI / 4);
    cbCtx.strokeStyle = rgba('#00A86B', a * 0.85);
    cbCtx.strokeRect(-f.r * 0.7, -f.r * 0.7, f.r * 1.4, f.r * 1.4);
    cbCtx.restore();
  }

  for (const e of enemies) {
    cbCtx.save(); cbCtx.translate(e.x, e.y);
    if (e.squash > 0.01) { cbCtx.rotate(e.squashAng); cbCtx.scale(1 - e.squash * 0.5, 1 + e.squash * 0.7); }
    cbCtx.beginPath(); cbCtx.arc(0, 0, e.r, 0, TAU);
    cbCtx.fillStyle = e.flash > 0 ? '#FFFFFF' : e.color; cbCtx.fill();
    cbCtx.strokeStyle = '#111315'; cbCtx.lineWidth = 1.6; cbCtx.stroke();
    cbCtx.restore();
    cbCtx.font = '800 12px Inter, sans-serif'; cbCtx.fillStyle = '#FFFFFF'; cbCtx.textAlign = 'center'; cbCtx.textBaseline = 'middle';
    cbCtx.fillText(String(e.hp), e.x, e.y);
  }

  for (const b of bullets) {
    cbCtx.beginPath(); cbCtx.arc(b.x, b.y, b.r, 0, TAU);
    cbCtx.fillStyle = '#0055FF'; cbCtx.fill(); cbCtx.strokeStyle = '#111315'; cbCtx.stroke();
  }

  if (tabMode === 'progression') {
    drawStyledOrb(cbCtx, player.x, player.y, player.r, ARCHETYPES[selIdx].id, curStage, time);
  } else {
    drawSuperpositionOrb(cbCtx, player.x, player.y, player.r + 2, COMBOS[selIdx], time);
  }
  cbCtx.restore();
}

function refreshUI() {
  const list = document.getElementById('itemList');
  const data = tabMode === 'progression' ? ARCHETYPES : COMBOS;
  list.innerHTML = data.map((it, i) =>
    '<button class="item-btn ' + (i === selIdx ? 'active' : '') + '" data-i="' + i + '" style="--accent:' + (it.color || it.a.col) + '">' +
      '<b>' + it.name + '</b><span>' + it.sub + '</span>' +
    '</button>'
  ).join('');

  document.getElementById('stagePills').style.display = tabMode === 'progression' ? 'flex' : 'none';
  if (tabMode === 'progression') {
    const arch = ARCHETYPES[selIdx];
    document.getElementById('leftCode').textContent = arch.code;
    document.getElementById('specCard').innerHTML = '<strong>' + arch.stages[curStage].name + '</strong><br>' + arch.stages[curStage].desc;
  } else {
    const c = COMBOS[selIdx];
    document.getElementById('leftCode').textContent = c.code;
    document.getElementById('specCard').innerHTML = c.desc;
  }
  document.querySelectorAll('.st-pill').forEach((b, i) => b.classList.toggle('active', i === curStage));
}

document.getElementById('topTabs').addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (!btn) return;
  tabMode = btn.dataset.tab; selIdx = 0;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b === btn));
  refreshUI();
});
document.getElementById('itemList').addEventListener('click', e => {
  const btn = e.target.closest('.item-btn');
  if (!btn) return;
  selIdx = Number(btn.dataset.i); refreshUI();
});
document.getElementById('stagePills').addEventListener('click', e => {
  const btn = e.target.closest('.st-pill');
  if (!btn) return;
  curStage = Number(btn.dataset.st); refreshUI();
});
document.getElementById('btnTrigger').onclick = () => triggerUlt();

window.addEventListener('resize', resize);
resize();
spawnEnemies(14);
refreshUI();
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderBlueprint();
  renderCombat();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
